<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(168, 85, 247, 0.3)" stroke-width="4" />
  
  <!-- Ambient Glow Behind Nodes -->
  <circle cx="256" cy="256" r="140" fill="url(#glowGrad)" opacity="0.18" filter="url(#bloom)" />
  
  <!-- Central Sync Core Hexagon Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-dasharray="14 10" opacity="0.5" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="url(#glowGrad)" stroke-width="5" opacity="0.75" />
  
  <!-- Connecting Bridge Beams -->
  <line x1="256" y1="110" x2="256" y2="402" stroke="url(#glowGrad)" stroke-width="3" opacity="0.6" />
  <line x1="130" y1="183" x2="382" y2="329" stroke="url(#glowGrad)" stroke-width="3" opacity="0.6" />
  <line x1="130" y1="329" x2="382" y2="183" stroke="url(#glowGrad)" stroke-width="3" opacity="0.6" />

  <!-- Peripheral Satellite Nodes (The 6 Worlds/Connectors) -->
  <circle cx="256" cy="110" r="22" fill="#06b6d4" filter="url(#bloom)" />
  <circle cx="256" cy="110" r="12" fill="#ffffff" />
  
  <circle cx="382" cy="183" r="22" fill="#8b5cf6" filter="url(#bloom)" />
  <circle cx="382" cy="183" r="12" fill="#ffffff" />
  
  <circle cx="382" cy="329" r="22" fill="#ec4899" filter="url(#bloom)" />
  <circle cx="382" cy="329" r="12" fill="#ffffff" />
  
  <circle cx="256" cy="402" r="22" fill="#10b981" filter="url(#bloom)" />
  <circle cx="256" cy="402" r="12" fill="#ffffff" />
  
  <circle cx="130" cy="329" r="22" fill="#f59e0b" filter="url(#bloom)" />
  <circle cx="130" cy="329" r="12" fill="#ffffff" />
  
  <circle cx="130" cy="183" r="22" fill="#3b82f6" filter="url(#bloom)" />
  <circle cx="130" cy="183" r="12" fill="#ffffff" />

  <!-- Central OmniSync Crystal Core -->
  <polygon points="256,170 316,210 316,302 256,342 196,302 196,210" fill="url(#glowGrad)" filter="url(#bloom)" opacity="0.9" />
  <polygon points="256,190 298,220 298,292 256,322 214,292 214,220" fill="#0f172a" />
  
  <!-- Harmonic Sync Pulse (Infinity / Torus / Diamond) -->
  <path d="M236 240 L256 220 L276 240 L256 260 Z" fill="#38bdf8" />
  <path d="M236 272 L256 252 L276 272 L256 292 Z" fill="#ec4899" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" />
</svg>
